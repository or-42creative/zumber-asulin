<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תודה שזמברת! · מזמברים את אסולין</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪗%3C/text%3E%3C/svg%3E" />
  <meta property="og:title" content="תודה שזמברת את אסולין!" />
  <link rel="preconnect" href="https://static.greeninvoice.co.il" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://static.greeninvoice.co.il/fonts/ploni.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" />
  <style>
    :root{
      --teal:#033841;
      --ink:#343434;
      --muted:#838999;
      --coral:#ff6c5d;
      --coral-dark:#f2543f;
      --green:#13be90;
      --line:#eff1f6;
      --page:#f4f5f7;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:"ploni","Heebo","Assistant","Segoe UI",Arial,sans-serif;
      background:var(--page);
      color:var(--ink);
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      line-height:1.7;
    }
    .topbar{
      width:100%;
      height:64px;
      background:#fff;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:800;
      color:var(--teal);
      font-size:18px;
    }
    .topbar .dot{font-size:20px}
    .main{
      flex:1;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 20px;
    }
    .card{
      width:100%;
      max-width:560px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:44px 30px;
      box-shadow:0 10px 40px rgba(3,56,65,.07);
      text-align:center;
    }
    .check{
      width:78px;height:78px;margin:0 auto 16px;
      border-radius:50%;
      background:rgba(19,190,144,.12);
      display:flex;align-items:center;justify-content:center;
      font-size:40px;
      animation:pop .5s ease;
    }
    @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
    h1{
      font-size:clamp(26px,6vw,36px);
      font-weight:800;
      color:var(--teal);
      margin-bottom:16px;
      letter-spacing:-.5px;
    }
    p.lead{
      font-size:clamp(15px,4vw,18px);
      color:#4b4b4b;
      margin-bottom:16px;
    }
    .note{
      background:rgba(255,108,93,.08);
      border:1px solid rgba(255,108,93,.25);
      border-radius:16px;
      padding:15px 18px;
      font-size:15px;
      color:#4b4b4b;
      margin:22px 0;
    }
    .note b{color:var(--teal)}
    .rank{
      font-size:15px;
      color:var(--muted);
      margin-bottom:22px;
    }
    .rank b{color:var(--green);font-weight:800}
    .btn{
      display:inline-block;
      background:var(--coral);
      color:#fff;
      font-weight:800;
      font-size:clamp(16px,4.4vw,19px);
      text-decoration:none;
      padding:15px 34px;
      border-radius:100px;
      box-shadow:0 8px 22px rgba(255,108,93,.35);
      transition:background .15s ease,transform .12s ease,box-shadow .12s ease;
    }
    .btn:hover{background:var(--coral-dark);transform:translateY(-1px);box-shadow:0 12px 28px rgba(255,108,93,.45)}
    .btn:active{transform:translateY(0)}
  </style>
</head>
<body>
  <div class="topbar"><span class="dot">🪗</span> מזמברים את אסולין</div>

  <div class="main">
    <main class="card">
      <div class="check">✅</div>
      <h1>תודה שזמברת את אסולין!</h1>
      <p class="lead">
        שלושת השקלים שלך התקבלו בהצלחה, וכבר עכשיו הם בדרך לחברת האשראי, למס הכנסה
        ולביטוח הלאומי — לא נשאר מהם כמעט כלום, בדיוק כמו שרצית. ❤️
      </p>

      <div class="rank" id="rank"></div>

      <div class="note">
        <b>אור אסולין מודה לך</b> ומתחיל למלא טופס בשביל האגורות שנשארו.
      </div>

      <a class="btn" href="./">לזמבר עוד פעם &raquo;</a>
    </main>
  </div>

  <script>
    // כל טעינה של עמוד התודה מוסיפה +1 למונה המשותף
    (function(){
      var NS='zumber-asulin-orasulin', KEY='paid', BASE=7;
      var rankEl=document.getElementById('rank');
      fetch('https://abacus.jasoncameron.dev/hit/'+NS+'/'+KEY)
        .then(function(r){return r.json();})
        .then(function(d){
          if(d && typeof d.value==='number'){
            rankEl.innerHTML='אתה הזמבר מספר <b>'+(BASE+d.value)+'</b> 🎉';
          }
        })
        .catch(function(){/* המונה פשוט לא יתעדכן */});
    })();
  </script>
</body>
</html>
